<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreelanceCRM — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.18;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: var(--accent);
      top: -180px; left: -180px;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: var(--pink);
      bottom: -120px; right: -100px;
    }
    .blob-3 {
      width: 300px; height: 300px;
      background: var(--green);
      top: 50%; left: 55%;
      opacity: 0.07;
    }

    /* grid overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .login-wrap {
      width: 420px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--r3);
      padding: 42px 40px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    .login-brand {
      margin-bottom: 30px;
    }
    .login-brand .name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .login-brand .name span { color: var(--accent2); }
    .login-brand .tagline {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .form-field {
      margin-bottom: 16px;
    }
    .form-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }
    .form-field input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px 14px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
    }
    .form-field input::placeholder { color: var(--muted2); }

    .btn-login {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: var(--r);
      padding: 13px;
      color: #fff;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      margin-top: 6px;
      box-shadow: 0 4px 20px rgba(79,110,247,0.35);
    }
    .btn-login:hover {
      background: #3d5ce8;
      box-shadow: 0 6px 28px rgba(79,110,247,0.45);
    }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-error {
      background: rgba(242,74,74,0.08);
      border: 1px solid rgba(242,74,74,0.2);
      border-radius: var(--r);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--red);
      margin-top: 14px;
      display: none;
    }
    .login-error.show { display: block; }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted2);
    }

    /* loading spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-brand">
        <div class="name">Freelance<span>CRM</span></div>
        <div class="tagline">Your agency, fully in control</div>
      </div>

      <div class="login-title">Welcome back</div>
      <div class="login-sub">Sign in to access your workspace</div>

      <div class="form-field">
        <label>Email address</label>
        <input type="email" id="inp-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-field">
        <label>Password</label>
        <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn-login" id="btn-login" onclick="doLogin()">Sign in →</button>

      <div class="login-error" id="login-error"></div>

      <div class="login-footer">
        No account? Ask your admin to add you via the Users page.
      </div>

    </div>
  </div>

  <div id="toast"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    // If already logged in → go to dashboard
    (async () => {
      const session = await getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    // Enter key support
    document.getElementById('inp-pass').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('inp-email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('inp-pass').focus();
    });

    async function doLogin() {
      const email    = document.getElementById('inp-email').value.trim();
      const password = document.getElementById('inp-pass').value.trim();
      const errEl    = document.getElementById('login-error');
      const btn      = document.getElementById('btn-login');

      errEl.classList.remove('show');

      if (!email || !password) {
        errEl.textContent = 'Please enter your email and password.';
        errEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = error.message || 'Invalid credentials. Try again.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Sign in →';
        return;
      }

      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
