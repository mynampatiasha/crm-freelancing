<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreelanceCRM — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy-dark:   #0D1B3E;
      --navy-mid:    #1A3A6B;
      --navy-light:  #2463AE;
      --navy-accent: #3D8EFF;
      --font: 'Outfit', sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--navy-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Navy mesh background (matches finance_welcome_screen.dart) ── */
    .bg-mesh {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0D1B3E 0%, #0A1628 55%, rgba(26,58,107,0.4) 100%);
      z-index: 0;
    }
    .bg-mesh::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    /* Decorative circles */
    .bg-circle {
      position: fixed; border-radius: 50%; pointer-events: none;
    }
    .bg-circle-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(61,142,255,0.08) 0%, transparent 70%);
      top: -200px; right: -100px;
    }
    .bg-circle-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(36,99,174,0.12) 0%, transparent 70%);
      bottom: -100px; left: -80px;
    }
    /* Top accent line */
    .bg-accent-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(61,142,255,0.7), transparent);
      z-index: 1;
    }

    /* ── Two-column layout (wide) ── */
    .login-shell {
      position: relative; z-index: 2;
      display: flex; align-items: center;
      width: 100%; max-width: 1000px;
      padding: 40px 24px;
      gap: 60px;
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Left branding panel */
    .login-brand-panel {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 0;
    }
    .logo-badge {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 46px; height: 46px; border-radius: 10px;
      background: linear-gradient(135deg, var(--navy-accent), var(--navy-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .logo-text .name { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: 0.2px; }
    .logo-text .name span { color: var(--navy-accent); }
    .logo-text .sub { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; margin-top: 1px; }

    .hero-title {
      font-size: 46px; font-weight: 800; color: #fff;
      line-height: 1.1; letter-spacing: -1.5px;
      margin-bottom: 18px;
    }
    .hero-title span { color: var(--navy-accent); }
    .hero-sub {
      font-size: 15px; color: rgba(255,255,255,0.6);
      line-height: 1.65; margin-bottom: 36px;
      max-width: 380px;
    }
    .feature-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 50px;
      font-size: 12px; font-weight: 600;
      border: 1px solid rgba(61,142,255,0.3);
      background: rgba(61,142,255,0.08);
      color: rgba(255,255,255,0.75);
    }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--navy-accent); }

    /* Right login card */
    .login-card-wrap { width: 400px; flex-shrink: 0; }
    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }
    .card-title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: #fff; opacity: 0.8; margin-bottom: 28px; }

    .form-field { margin-bottom: 16px; }
    .form-field label {
      display: block; font-size: 11px; font-weight: 700;
      color: #fff; opacity: 0.75; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 7px;
    }
    .form-field input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-field input:focus {
      border-color: var(--navy-accent);
      background: rgba(255,255,255,0.09);
      box-shadow: 0 0 0 3px rgba(61,142,255,0.15);
    }
    .form-field input::placeholder { color: rgba(255,255,255,0.35); }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #0D1B3E 0%, #1A3A6B 50%, #2463AE 100%);
      border: 1px solid rgba(61,142,255,0.4);
      border-radius: 8px;
      padding: 13px;
      color: #fff;
      font-family: var(--font);
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.2s;
      margin-top: 6px;
      box-shadow: 0 4px 20px rgba(13,27,62,0.5);
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #1A3A6B 0%, #2463AE 50%, #3D8EFF 100%);
      box-shadow: 0 6px 28px rgba(61,142,255,0.3);
      transform: translateY(-1px);
    }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px; color: #FCA5A5;
      margin-top: 14px; display: none;
    }
    .login-error.show { display: block; }
    .login-footer { margin-top: 22px; text-align: center; font-size: 12px; color: #fff; opacity: 0.6; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mini stat cards on brand panel */
    .mini-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 36px; }
    .mini-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px;
    }
    .mini-card .mc-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; margin-bottom: 10px;
    }
    .mini-card .mc-val { font-size: 18px; font-weight: 800; color: #fff; }
    .mini-card .mc-label { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }

    /* Responsive */
    @media (max-width: 800px) {
      .login-brand-panel { display: none; }
      .login-shell { justify-content: center; padding: 24px 16px; }
      .login-card-wrap { width: 100%; max-width: 420px; }
    }
    /* Always hide left panel — heading is above card now */
    .login-brand-panel { display: none; }
    .login-shell { justify-content: center; }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-accent-line"></div>

  <div class="login-shell">

    <!-- LEFT — Branding -->
    <div class="login-brand-panel">
      <div class="logo-badge">
        <div class="logo-icon">💼</div>
        <div class="logo-text">
          <div class="name">Freelance<span>CRM</span></div>
          <div class="sub">Your agency, fully in control</div>
        </div>
      </div>
    </div>

    <!-- RIGHT — Login card -->
    <div class="login-card-wrap">
      <div style="margin-bottom:20px">
        <div style="font-size:26px;font-weight:800;color:#fff;letter-spacing:-0.5px">Freelance<span style="color:var(--navy-accent)">CRM</span></div>
        <div style="font-size:13px;color:#fff;margin-top:4px;opacity:0.75">Your agency, fully in control</div>
      </div>
      <div class="login-card">
        <div class="card-title">Welcome back</div>
        <div class="card-sub">Sign in to your workspace</div>

        <div class="form-field">
          <label>Email Address</label>
          <input type="email" id="inp-email" placeholder="you@abratravel.com" autocomplete="email" />
        </div>
        <div class="form-field">
          <label>Password</label>
          <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button class="btn-login" id="btn-login" onclick="doLogin()">Sign in →</button>
        <div class="login-error" id="login-error"></div>
        <div class="login-footer">No account? Ask your admin to add you via the Users page.</div>
      </div>
    </div>

  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    (async () => {
      const session = await getSession();
      if (session) { window.location.href = 'dashboard.html'; return; }
    })();

    document.getElementById('inp-email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inp-pass').focus(); });
    document.getElementById('inp-pass').addEventListener('keydown',  e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const email    = document.getElementById('inp-email').value.trim();
      const password = document.getElementById('inp-pass').value;
      const errEl    = document.getElementById('login-error');
      const btn      = document.getElementById('btn-login');
      errEl.classList.remove('show');
      if (!email || !password) {
        errEl.textContent = 'Please enter your email and password.';
        errEl.classList.add('show'); return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in…';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message || 'Invalid credentials. Try again.';
        errEl.classList.add('show');
        btn.disabled = false; btn.innerHTML = 'Sign in →'; return;
      }
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
